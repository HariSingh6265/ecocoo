<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Neo-Brutalist Shadow -->
  <circle cx="268" cy="268" r="230" fill="#000000" />
  <!-- Main Button Circle -->
  <circle cx="256" cy="256" r="230" fill="#2ecc71" stroke="#000000" stroke-width="12" />
  <!-- Inner dashed border -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#000000" stroke-width="5" stroke-dasharray="20, 15" />
  <!-- Recycling symbol shape in center (Vector path) -->
  <path d="M256,90 
           L330,170 M256,90 L182,170 
           M256,90 L256,230" 
        stroke="#000000" stroke-width="12" stroke-linecap="round" display="none" />
  <!-- We can use a bold leaf path combined with a recycle text or emoji for maximum visual wow -->
  <!-- A beautiful hand-crafted bold leaf vector -->
  <path d="M256,110 
           C320,190 360,240 360,310 
           C360,370 310,410 256,410 
           C202,410 152,370 152,310 
           C152,240 192,190 256,110 Z" 
        fill="#ffffff" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
  <!-- Leaf Vein -->
  <path d="M256,210 L256,410" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <path d="M256,280 Q290,260 310,240" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M256,330 Q210,310 190,290" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Superimposed Recycling Icon Badge -->
  <rect x="300" y="300" width="100" height="100" rx="20" fill="#f1c40f" stroke="#000000" stroke-width="8" transform="rotate(-15 350 350)" />
  <text x="345" y="365" font-family="sans-serif" font-size="60" text-anchor="middle" font-weight="900" transform="rotate(-15 350 350)">♻️</text>
</svg>
