<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiGravity Jarvis - System Core</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="hud-overlay"></div>
    <div class="grid-bg"></div>

    <div class="container">
        <!-- Left Panel: System Stats -->
        <div class="panel glass left-panel">
            <h2 class="panel-title">SYSTEM DIAGNOSTICS</h2>
            <div class="stat-box">
                <span class="stat-label">CORE TEMP</span>
                <span class="stat-value text-cyan">34°C</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">CPU LOAD</span>
                <span class="stat-value text-green">12%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">MEMORY</span>
                <span class="stat-value text-cyan">4.2 TB</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">AI ENGINE</span>
                <span class="stat-value text-green">ONLINE</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">NETWORK</span>
                <span class="stat-value text-orange">OFFLINE (LOCAL MODE)</span>
            </div>
        </div>

        <!-- Center Panel: 3D Hologram & Voice -->
        <div class="center-stage">
            <div id="hologram-container"></div>
            <div class="status-indicator" id="status-text">SYSTEM STANDBY</div>
            <div class="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <button id="mic-btn" class="glow-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                INITIATE PROTOCOL
            </button>
        </div>

        <!-- Right Panel: Chat Log -->
        <div class="panel glass right-panel">
            <h2 class="panel-title">COMMUNICATION LINK</h2>
            <div class="chat-log" id="chat-log">
                <div class="message jarvis">
                    <span class="sender">JARVIS:</span> Systems online. Welcome back, sir. I am fully operational and running in localized offline mode. How may I assist you today?
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="text-input" placeholder="Enter command protocol...">
                <button id="send-btn" class="glow-btn small">SEND</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
